    <script>
      (function () {
        const root = document.documentElement;
        // Force light theme to unify with AR Model Lite app shell
        try { window.localStorage && window.localStorage.setItem("cad-viewer:color-scheme", "light"); } catch {}
        root.dataset.themePreference = "light";
        root.dataset.theme = "light";
        root.classList.remove("dark");

      // Clean Diagnostic Logging & Interception System (Errors & Warnings Only)
      (function() {
        function emitLog(type, msg) {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'CAD_DIAGNOSTIC_LOG', level: type, text: String(msg) }, '*');
            }
          } catch(e) {}
        }

        window.addEventListener('error', function(e) {
          emitLog('error', 'Uncaught Error: ' + (e.message || e.error) + ' at ' + e.filename + ':' + e.lineno);
        });

        window.addEventListener('unhandledrejection', function(e) {
          emitLog('error', 'Unhandled Promise Rejection: ' + (e.reason?.message || e.reason));
        });

        const origError = console.error;
        console.error = function() {
          origError.apply(console, arguments);
          const args = Array.from(arguments).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          emitLog('error', '[Console.Error] ' + args);
        };

        const origWarn = console.warn;
        console.warn = function() {
          origWarn.apply(console, arguments);
          const args = Array.from(arguments).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          emitLog('warn', '[Console.Warn] ' + args);
        };

        // Intercept fetch requests ONLY on failure/error (Prevent React re-render flooding)
        const origFetch = window.fetch;
        window.fetch = function() {
          const url = arguments[0];
          return origFetch.apply(window, arguments).then(function(res) {
            if (!res.ok && res.status !== 501 && res.status !== 404) {
              emitLog('error', '<- Fetch Error [' + res.status + ' ' + res.statusText + '] for ' + url);
            }
            return res;
          }).catch(function(err) {
            emitLog('error', '<- Fetch Network Failed: ' + err.message + ' for ' + url);
            throw err;
          });
        };
      })();
